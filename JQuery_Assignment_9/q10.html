<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Form Validation | Assignment 9</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="q10.js" defer></script>
</head>
<body>
<main>
  <header><p class="muted">jQuery Assignment 9 · Question 10</p><h1>Registration Form Validation</h1></header>
  
<section aria-label="Create an account">
  <form id="registrationForm" novalidate>
    <p><label for="name">Full name</label><br><input id="name" name="name" type="text" autocomplete="name"><span class="error" id="nameError"></span></p>
    <p><label for="email">Email address</label><br><input id="email" name="email" type="email" autocomplete="email"><span class="error" id="emailError"></span></p>
    <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="new-password"><span class="error" id="passwordError"></span></p>
    <button type="submit">Register</button>
  </form>
  <p id="formSuccess" class="success" role="status"></p>
  <p class="muted">Demo note: email uniqueness is checked against the browser's localStorage for this demonstration.</p>
</section>

</main>
</body>
</html>
