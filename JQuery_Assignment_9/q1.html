<body>
<main>
  <header><p class="muted">jQuery Assignment 9 · Question 1</p><h1>Welcome Page Greeting</h1></header>
  
<section aria-labelledby="greeting-heading">
  <h2 id="greeting-heading">Hello, visitor!</h2>

  <p class="welcome-message" id="welcomeMessage">We are glad you are here. Explore and enjoy your visit!</p>

</section>
